<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vstyg Food</title>
    <style>
        :root { --primary: #18a957; --dark: #111827; --gray: #6b7280; --light-bg: #f8f8f6; }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--light-bg); color: var(--dark); overflow-x: hidden; }
        
        .header { background: #fff; padding: 15px; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 900; }
        .logo span { color: var(--primary); }

        .main-content { padding: 15px; padding-bottom: 100px; min-height: 100vh; }
        .screen { display: none; }
        .screen.active { display: block; }

        .card { background: white; border-radius: 20px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .img-box { height: 180px; background-size: cover; background-position: center; position: relative; }
        .badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
        .contacts { position: absolute; bottom: 10px; left: 10px; display: flex; gap: 8px; }
        .c-btn { background: white; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px; }

        .btn-main { background: var(--dark); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 800; width: 100%; cursor: pointer; }

        .nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #eee; z-index: 999; }
        .nav-item { text-align: center; font-size: 10px; font-weight: 700; color: var(--gray); cursor: pointer; }
        .nav-item.active { color: var(--primary); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">Vstyg <span>Food</span></div>
</div>

<div class="main-content">
    <div id="screen-home" class="screen active">
        <div class="card">
            <div class="img-box" style="background-image:url('https://images.unsplash.com/photo-1559339352-11d035aa65de?w=600');">
                <div class="badge">⏳ 9:03</div>
                <div class="contacts">
                    <a href="https://t.me/your_bot" class="c-btn">✈️ ТГ</a>
                    <a href="tel:+380000000000" class="c-btn">📞 Тел</a>
                </div>
            </div>
            <div style="padding: 15px;">
                <div style="font-weight: 900; font-size: 18px;">First Point</div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                    <div style="font-size: 20px; font-weight: 900;">95 грн</div>
                    <button class="btn-main" style="width: auto;" onclick="openOrder()">ВСТИГНУТИ</button>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-user" class="screen">
        <div style="text-align:center; padding: 20px 0;"><h2>Кабінет</h2></div>
        <button class="btn-main" onclick="openModal('report-modal')">💬 Поскаржитись на проблему</button>
    </div>
</div>

<div class="nav">
    <div class="nav-item active" onclick="showScreen('home', this)">🏠<br>Головна</div>
    <div class="nav-item" onclick="showScreen('user', this)">👤<br>Кабінет</div>
</div>

<div id="report-modal" class="modal" onclick="closeModal('report-modal')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3>Скарга</h3>
        <textarea style="width:100%; height:100px; margin:10px 0; padding:10px;" placeholder="Опишіть проблему..."></textarea>
        <button class="btn-main" onclick="closeModal('report-modal')">Надіслати</button>
    </div>
</div>

<script>
    function showScreen(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('screen-' + id).classList.add('active');
        el.classList.add('active');
    }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function openOrder() { alert('Бронь прийнято!'); }
</script>
</body>
</html>
