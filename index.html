<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vstyg Food</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #f8f8f6; }
        .header { background: #fff; padding: 15px; border-bottom: 1px solid #eee; position: sticky; top:0; z-index: 100; }
        .main-content { padding: 15px; padding-bottom: 80px; }
        .screen { display: none; }
        .screen.active { display: block; }
        .nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #eee; z-index: 100; }
        .nav-item { text-align: center; font-size: 10px; color: #6b7280; }
        .nav-item.active { color: #18a957; }
        .card { background: #fff; border-radius: 20px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .img-placeholder { width: 100%; height: 150px; background: #ddd; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <div style="font-weight:900; font-size:20px;">Vstyg Food</div>
        <input type="text" placeholder="Пошук..." style="width:100%; padding:8px; margin-top:10px; border: 1px solid #ccc; border-radius: 8px;">
    </div>
    
    <div class="main-content">
        <div id="screen-home" class="screen active">
            <div class="card">
                <div class="img-placeholder"></div>
                <h3>First Point</h3>
                <p>95 грн</p>
                <button onclick="alert('Встигли!')" style="background:#18a957; color:white; border:none; padding:10px 20px; border-radius:8px;">ВСТИГНУТИ</button>
            </div>
        </div>
        <div id="screen-biz" class="screen"><h3>Бізнес</h3></div>
        <div id="screen-fav" class="screen"><h3>Улюблені</h3></div>
        <div id="screen-user" class="screen"><h3>Кабінет</h3></div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="show('home',this)">🏠<br>Головна</div>
        <div class="nav-item" onclick="show('biz',this)">🏬<br>Бізнес</div>
        <div class="nav-item" onclick="show('fav',this)">❤️<br>Улюблені</div>
        <div class="nav-item" onclick="show('user',this)">👤<br>Кабінет</div>
    </div>

    <script>
        function show(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-'+id).classList.add('active');
            el.classList.add('active');
        }
    </script>
</body>
</html>
