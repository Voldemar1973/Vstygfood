<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vstyg Food</title>
    <style>
        :root { --primary: #18a957; --dark: #111827; --gray: #6b7280; --light-bg: #f8f8f6; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--light-bg); height: 100vh; display: flex; flex-direction: column; }

        .header { background: #fff; padding: 15px; border-bottom: 1px solid #eee; }
        .logo { font-size: 22px; font-weight: 900; }
        .logo span { color: var(--primary); }
        .slogan { font-size: 12px; font-weight: 700; color: var(--primary); margin: 5px 0; }
        .search-bar { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #eee; background: #f9f9f9; }

        .main-content { flex: 1; overflow-y: auto; padding: 15px; }
        .screen { display: none; }
        .screen.active { display: block; }

        .card { background: white; border-radius: 20px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .img-box { height: 180px; background-size: cover; background-position: center; position: relative; }
        .badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
        .c-btn { background: white; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px; margin-right: 5px; }

        .btn-main { background: var(--dark); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 800; }
        
        .nav { background: white; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #eee; }
        .nav-item { text-align: center; font-size: 10px; font-weight: 700; color: var(--gray); cursor: pointer; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">Vstyg <span>Food</span></div>
    <div class="slogan">Гарячі пропозиції поруч</div>
    <input type="text" class="search-bar" placeholder="🔍 Пошук закладу...">
</div>

<div class="main-content">
    <div id="screen-home" class="screen active">
        <div class="card">
            <div class="img-box" style="background-image:url('https://images.unsplash.com/photo-1559339352-11d035aa65de?w=600');">
                <div class="badge">⏳ 9:03</div>
                <div style="position:absolute; bottom:10px; left:10px;">
                    <a href="#" class="c-btn">✈️ ТГ</a>
                    <a href="#" class="c-btn">📞 Тел</a>
                </div>
            </div>
            <div style="padding:15px;">
                <div style="font-weight:900; font-size:18px;">First Point</div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
                    <div style="font-size:20px; font-weight:900;">95 грн</div>
                    <button class="btn-main" onclick="alert('Бронь!')">ВСТИГНУТИ</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="screen-biz" class="screen"><h2>Бізнес</h2></div>
    <div id="screen-fav" class="screen"><h2>Улюблені</h2></div>
    <div id="screen-user" class="screen"><h2>Кабінет</h2></div>
</div>

<div class="nav">
    <div class="nav-item active" onclick="showScreen('home', this)">🏠<br>Головна</div>
    <div class="nav-item" onclick="showScreen('biz', this)">🏬<br>Бізнес</div>
    <div class="nav-item" onclick="showScreen('fav', this)">❤️<br>Улюблені</div>
    <div class="nav-item" onclick="showScreen('user', this)">👤<br>Кабінет</div>
</div>

<script>
    function showScreen(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('screen-' + id).classList.add('active');
        el.classList.add('active');
    }
</script>
</body>
</html>
